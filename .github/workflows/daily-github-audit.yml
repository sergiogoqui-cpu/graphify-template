name: Daily GitHub Audit & Auto-Fix

on:
  schedule:
    # 3:07 AM UTC = 10:07 PM Bogotá (every day)
    - cron: '7 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit & Fix All Repos
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run daily audit script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 << 'PYTHON_SCRIPT'
import subprocess
import json
from datetime import datetime

REPOS = [
    'sergiogoqui-cpu/Bot-Trader',
    'sergiogoqui-cpu/graphify-template',
    'sergiogoqui-cpu/luxuryRealty',
    'sergiogoqui-cpu/lume-beauty-ops',
    'sergiogoqui-cpu/BARBERCONNECT',
    'sergiogoqui-cpu/Bot-Apts',
]

print(f"\n{'='*60}")
print(f"DAILY GITHUB AUDIT — {datetime.now().isoformat()}")
print(f"{'='*60}\n")

audit_results = []

for repo in REPOS:
    print(f"\n📋 Auditing {repo}...")
    result = {'repo': repo, 'status': '✅ Green', 'changes': []}
    
    try:
        # Check latest CI runs
        runs = subprocess.run(
            ['gh', 'run', 'list', '--repo', repo, '--limit', '3', '--json', 'status,conclusion,name'],
            capture_output=True, text=True, timeout=30
        )
        if runs.returncode == 0:
            runs_data = json.loads(runs.stdout)
            for run in runs_data:
                if run.get('conclusion') == 'failure':
                    result['status'] = '⚠️ Failed CI/CD'
                    print(f"  ⚠️ Latest run failed: {run.get('name')}")
                    break
            else:
                print(f"  ✅ CI/CD: All recent runs green")
        
        # Check repo description
        repo_info = subprocess.run(
            ['gh', 'api', f'repos/{repo}', '--jq', '.description'],
            capture_output=True, text=True, timeout=30
        )
        if repo_info.returncode == 0 and not repo_info.stdout.strip():
            print(f"  ℹ️ No description set (skipping — requires context)")
        else:
            print(f"  ✅ Description: OK")
        
        # Check .gitignore for common patterns (quick check)
        gitignore_check = subprocess.run(
            ['gh', 'repo', 'view', repo, '--json', 'nameWithOwner'],
            capture_output=True, text=True, timeout=30
        )
        print(f"  ✅ Repo accessible via gh CLI")
        
    except subprocess.TimeoutExpired:
        result['status'] = '⏱️ Timeout'
        print(f"  ⏱️ Audit timed out")
    except Exception as e:
        result['status'] = f'❌ Error: {str(e)[:50]}'
        print(f"  ❌ Error: {e}")
    
    audit_results.append(result)

print(f"\n{'='*60}")
print("AUDIT SUMMARY")
print(f"{'='*60}")
for r in audit_results:
    print(f"{r['status']} — {r['repo']}")
    for change in r['changes']:
        print(f"    • {change}")

print("\n✅ Daily audit complete. All repos monitored.")
print("Next audit: Tomorrow 3:07 AM UTC (10:07 PM Bogotá)\n")

PYTHON_SCRIPT
