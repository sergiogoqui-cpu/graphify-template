name: Graphify — Bot-Trader Weekly Knowledge Graph

on:
  schedule:
    # Every Monday 2:15 AM UTC (9:15 PM Bogotá)
    - cron: '15 2 * * 1'
  workflow_dispatch:

jobs:
  graphify:
    runs-on: ubuntu-latest
    name: Generate Bot-Trader Knowledge Graph
    
    permissions:
      contents: read
    
    steps:
      - name: Graphify Bot-Trader Repository
        run: |
          echo "🔍 Generating knowledge graph for sergiogoqui-cpu/Bot-Trader..."
          echo "Repository: Trading bot with MT5 integration"
          echo "Mode: Deep analysis (architecture, strategies, connectors)"
          echo "This job would run: /graphify sergiogoqui-cpu/Bot-Trader --mode deep"
          echo ""
          echo "✅ Job scheduled: Every Monday 2:15 AM UTC"
          echo "Output will be saved to: Bot-Trader/graphify-out/graph.html"
